# Проект генерируется XcodeGen: `xcodegen generate` (см. scripts/bootstrap.sh).
name: Umbra

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Go-рантайм внутри LibXray тянет libresolv.
    OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]
    # Ядро собрано под arm64; маки с Intel не поддерживаем.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # В симуляторе без команды разработчика — локальная подпись, иначе нет App Group.
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: PacketTunnel
      - framework: Vendor/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX)
            CFBundleURLSchemes: [$(APP_URL_SCHEME)]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - Geist-Black.ttf
          - GeistMono-Medium.ttf
          - GeistMono-Bold.ttf
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_NAME: Umbra
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: [Resources]
      - path: PacketTunnel/Resources
        buildPhase: resources
      - path: Shared
    dependencies:
      - framework: Vendor/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tunnel

  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  App:
    build:
      targets:
        App: all
        UITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [UITests]
    archive:
      config: Release
